<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suspicious Alerts - AML Transaction Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>AML Transaction Monitor</h1>
      <p>Report suspicious transactions with secure details.</p>
    </div>
    <nav aria-label="Primary navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="suspicious.html">Suspicious Alerts</a></li>
        <li><a href="transactions.html">Transaction Audit</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h2>Identify Suspicious Activity</h2>
      <p>Submit details for transactions you believe may require further review.</p>
    </section>

    <section class="form-wrapper">
      <form>
        <fieldset>
          <legend>Suspicious Transaction Details</legend>

          <label for="transactionId">Transaction ID</label>
          <input type="text" id="transactionId" name="transactionId" placeholder="Enter transaction ID" required>

          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="5" placeholder="Describe reason behind review results"></textarea>

          <div class="radio-group">
            <span>Risk level</span>
            <label><input type="radio" name="risk" value="high" checked> High</label>
            <label><input type="radio" name="risk" value="medium"> Medium</label>
            <label><input type="radio" name="risk" value="low"> Low</label>
          </div>

          <label for="reviewer">Reviewer</label>
          <select id="reviewer" name="reviewer" required>
            <option value="">Select a reviewer</option>
            <option value="David Burgos">David Burgos</option>
            <option value="Yiorgos A. Bakamitsos">Yiorgos A. Bakamitsos</option>
            <option value="William Sauce">William Sauce</option>
            <option value="Christopher F. Roellke">Christopher F. Roellke</option>
          </select>

          <button type="submit" style="margin-top: 20px;">Submit Alert</button>
        </fieldset>
      </form>
    </section>
  </main>
</body>
</html>
